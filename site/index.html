<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--HEAD-->
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/avatar/hero-still.webp" as="image" media="(min-width: 541px)" fetchpriority="high" />
    <script>
      // Before first paint: decide whether anything animates, so the avatar never flashes.
      (function () { var d = document.documentElement, c = navigator.connection; d.classList.add("js");
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches && !(c && c.saveData)) d.classList.add("motion"); })();
    </script>
  </head>
  <body>
    <!--APP-->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
